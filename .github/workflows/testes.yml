name: Testes do banco

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biblioteca
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: biblioteca
    steps:
      - uses: actions/checkout@v4
      - name: Cria o banco
        run: psql -v ON_ERROR_STOP=1 -f executar_tudo.sql
      - name: Roda os testes
        run: psql -v ON_ERROR_STOP=1 -f testes/testes.sql
      - name: Roda as consultas
        run: |
          psql -v ON_ERROR_STOP=1 -f consultas/subconsultas.sql
          psql -v ON_ERROR_STOP=1 -f consultas/joins.sql
          psql -v ON_ERROR_STOP=1 -f consultas/explain.sql

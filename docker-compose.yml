# Sobe um PostgreSQL já com o banco da biblioteca criado e populado:
#   docker compose up -d
#   docker compose exec db psql -U postgres -d biblioteca
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biblioteca
    ports:
      - "5432:5432"
    volumes:
      # Os scripts de scripts/ rodam em ordem (01 a 06) na primeira inicialização.
      - ./scripts:/docker-entrypoint-initdb.d:ro
      - ./consultas:/consultas:ro
      - ./testes:/testes:ro
